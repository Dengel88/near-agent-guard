# Agent Guard policy. Rules here are deterministic and run BEFORE the AI
# screener; the screener can only make a decision stricter, never looser.

treasury:
  # NEAR account that holds the agent's spending money (USDC on NEAR).
  # Override with TREASURY_NEAR_ACCOUNT. Its key lives only in the env.
  account: wanderlust.near   # must be an existing account (1Click refunds go here)
  token_contract: 17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1  # USDC on NEAR

agents:
  - id: ap-agent
    name: Accounts-payable agent
    # API key the agent sends as `Authorization: Bearer ...`; override with AGENT_KEY_AP_AGENT
    api_key: demo-agent-key
    policy:
      per_tx_limit_usd: 25        # hard cap per payment
      daily_limit_usd: 50         # hard cap per UTC day (executed + pending)
      approval_above_usd: 1.5     # bigger payments wait for a human
      max_tx_per_hour: 10
      allowed_chains: [near, base, arb, sol, eth]
      allowed_tokens: [USDC]
      unknown_recipient: hold     # hold | block
      ai_screening: true
      ai_hold_score: 40           # risk >= this -> human approval
      ai_block_score: 80          # risk >= this -> blocked
      approval_ttl_minutes: 60    # held payments expire if nobody decides
    # Known payees. A payment that names one of them but goes to a different
    # address is the classic "we changed our bank details" fraud.
    allowlist:
      - name: Northwind Coffee
        aliases: [northwind, northwind coffee]
        chain: near
        address: wanderlust.near
        token: USDC
      - name: Cloudburst GPU
        aliases: [cloudburst]
        chain: base
        # demo placeholder; set CLOUDBURST_ADDRESS (a Base address) to a wallet you own before approving it in live mode
        address: "${CLOUDBURST_ADDRESS:-0x7a3b1c9d2e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b}"
        token: USDC
    denylist:
      - "0x000000000000000000000000000000000000dEaD"
